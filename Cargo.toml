[package]
name = "path-guard"
version = "0.1.0"
edition = "2021"
description = "查出你敲的命令实际跑的是哪一个副本、被谁遮蔽、以及更新到底生效没有"
license = "MIT"
repository = "https://github.com/webkubor/path-guard"
keywords = ["path", "shadowing", "diagnostics", "cli", "node"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
